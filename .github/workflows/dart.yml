name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Get Packages
        run: flutter pub get
      - name: Debug Podfile
        run: |
          echo "===== Current Directory ====="
          pwd
          echo "===== ios folder ====="
          ls -la ios
          echo "===== Podfile ====="
          cat ios/Podfile
      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod deintegrate
          pod repo update
          pod install --repo-update --verbose

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: build/ios/iphoneos/Runner.app
